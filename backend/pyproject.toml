[project]
name = "document-copilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.4",
    "argon2-cffi==23.1.0",
    "docling==2.26.0",
    "fastapi==0.136.3",
    "httpx==0.28.1",
    "openai==2.40.0",
    "pgvector==0.4.2",
    "psycopg2-binary==2.9.12",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-ai==2.0.0b5",
    "pydantic-settings==2.14.1",
    "python-dotenv>=1.1.0",
    "sqlalchemy==2.0.50",
    "structlog==25.5.0",
    "supabase==2.30.1",
    "tiktoken==0.7.0",
    "uvicorn==0.48.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: integration tests requiring live Supabase + OpenAI",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "ipykernel==7.2.0",
    "pytest==9.0.3",
    "ruff==0.15.15",
]
